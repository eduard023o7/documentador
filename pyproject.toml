[project]
name = "documentador"
version = "0.1.0"
description = "Plataforma de lineamientos y estándares de arquitectura con agentes de IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "ruamel.yaml>=0.18,<0.19",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "boto3>=1.35,<2",
    "python-docx>=1.1,<2",
]

[project.scripts]
doc = "documentador.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "moto[dynamodb,s3,ssm]>=5,<6",
    "respx>=0.21,<1",
    "ruff>=0.6",
    "mypy>=1.11",
]
infra = [
    "aws-cdk-lib>=2.160,<3",
    "constructs>=10,<11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documentador"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["infra/cdk.out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "documentador.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "infra/tests"]
pythonpath = ["src", "infra"]
markers = ["integration: usa AWS o GitHub reales (cuesta dinero o requiere credenciales)"]
addopts = "-m 'not integration'"

[tool.uv]
default-groups = ["dev", "infra"]
